<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo-Fi Pixel Weather Tree</title>
    
    <!-- CSS Modular Structure -->
    <link rel="stylesheet" href="DATA/CSS-Tree/view.css">
    <link rel="stylesheet" href="DATA/CSS-Tree/effect.css">
    <link rel="stylesheet" href="DATA/CSS-Tree/responsive.css">
    <link rel="stylesheet" href="DATA/CSS-Sky/effect.css">
    <link rel="stylesheet" href="DATA/CSS-Sky/view.css">
</head>
<body>
    <div id="sky-container"></div>
    <!-- Panel Informasi Cuaca Real-Time -->
    <div class="weather-panel">
        <h3>📍 Purwakarta, Jawa Barat</h3>
        <p>Kecepatan Angin: <span id="wind-speed" class="data-highlight">Mengambil data...</span></p>
        <p>Status: <span id="wind-status" class="data-highlight">...</span></p>
    </div>

    

    <!-- Kontainer Pohon & Tanah -->
    <div id="tree-container"></div>
    <div class="ground"></div>

    <!-- Panel Kontrol Layar Nyala (Screen Wake Lock) -->
    <div id="status-box">
        <span id="status-text">Layar: Siap</span>
        <button id="start-btn">Aktifkan Layar Nyala</button>
    </div>

    <!-- JS Modular Structure -->
    <script src="DATA/JS-Tree/effect.js"></script>
    <script src="DATA/JS-Tree/main.js"></script>

    <script src="DATA/JS-Sky/effect.js"></script>
    <script src="DATA/JS-Sky/sky.js"></script>
    <script src="DATA/JS-Sky/main.js"></script>
</body>
</html>
